###########################################
# Legacy gear only
# Old network/embedded devices that still need SHA1 KEX, ssh-rsa host keys
# or CBC ciphers. List only those devices on the Host line below
# (aliases, hostnames or IPs). Never add a bare * wildcard here.
##########################################

Host legacy-*
    KexAlgorithms +diffie-hellman-group14-sha1
    HostKeyAlgorithms +ssh-rsa
    Ciphers +aes256-cbc
